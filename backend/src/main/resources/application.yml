server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tripflow_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: your_mysql_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  sql:
    init:
      mode: always
      continue-on-error: true

logging:
  level:
    com.tripflow: DEBUG
